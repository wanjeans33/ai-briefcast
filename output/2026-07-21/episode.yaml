        tag: 头条 02 · 数学
        icon: 🧮
        title: AI破了87年数学悬案
        body: Anthropic研究员用Fable 5找到**1939年**雅可比猜想的反例，三个不同的点变到同一点，谁都能代入公式**手工验算**，正式结论等数学界核验
        punch: 不晒跑分，晒一道人人能验的算式
      - kind: explainer
        grad: c3
        icon: 📐
        rel: 头条02
        title: 雅可比猜想是什么
        body: 1939年提出，说一类多项式变换只要满足某个判定条件就能完美还原。数学家攻了**87年**，没证出，也一直没找到反例
      - kind: explainer
        grad: c3
        icon: 🎯
        rel: 头条02
        title: 一个反例就能终结猜想
        body: 猜想说"全都如此"，找到一个例外就整体推翻。1966年计算机也这样推翻过欧拉的猜想，论文正文只有**两句话**

