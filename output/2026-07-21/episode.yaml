      - kind: point
        grad: c4
        tag: 头条 03 · 产业
        icon: 📱
        title: AI抢内存，手机先涨价
        body: 印度上季度手机出货跌**10%**，最便宜档暴跌**45%**，平均涨价一成半，只因大厂把内存产能挪去喂AI数据中心
        punch: AI的账单，离它最远的人先付
      - kind: explainer
        grad: c4
        icon: 🍰
        rel: 头条03
        title: AI为什么抢内存
        body: AI芯片配的高带宽内存HBM，同样容量要吃**3到4倍**晶圆产能，卖价还高出好几倍，内存大厂当然优先做它

