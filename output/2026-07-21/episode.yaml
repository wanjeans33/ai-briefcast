        body: 20美元Pro、100和200美元Max，越贵限额越高。这次Fable 5只进**Max**，是给高价档的独家福利
      - kind: explainer
        grad: c1
        icon: 🚧
        rel: 头条01
        title: Fable 5为什么被下架过
        body: 上月它刚发布就撞上**出口管制**，官方没法实时核验用户国籍，干脆全球暂停，三周后才解禁回归

